name: CI and production deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Test extraction
        working-directory: extraction
        run: python -m pytest tests -q
      - name: Test OCR
        working-directory: ocr
        run: python -m pytest tests -q
      - name: Test candidate publishing
        working-directory: preview
        run: python -m pytest tests -q
      - name: Test web API
        run: python -m pytest web_api/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_portal/package-lock.json
      - name: Test frontend
        working-directory: web_portal
        run: npm ci && npm run lint && npm test

  container-build:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: api
            file: Dockerfile.api
          - image: frontend
            file: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: polymerlit-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: container-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Read deployed revision
        id: deployed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          deployed_sha="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" 'basename "$(readlink -f /srv/polymerlit/current)"')"
          git cat-file -e "${deployed_sha}^{commit}"
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package incremental revision
        if: steps.deployed.outputs.changed == 'true'
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          bundle_ref="refs/deploy/${GITHUB_SHA}"
          git update-ref "$bundle_ref" "$GITHUB_SHA"
          git bundle create "/tmp/polymerlit-${GITHUB_SHA}.bundle" "$bundle_ref" "^${DEPLOYED_SHA}"
          git update-ref -d "$bundle_ref"
      - name: Upload incremental revision
        if: steps.deployed.outputs.changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp "/tmp/polymerlit-${GITHUB_SHA}.bundle" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/polymerlit-${GITHUB_SHA}.bundle"
          scp deploy/scripts/remote-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/polymerlit-${GITHUB_SHA}-deploy.sh"
      - name: Deploy immutable revision
        if: steps.deployed.outputs.changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash '/tmp/polymerlit-${{ github.sha }}-deploy.sh' '${{ github.sha }}' '/tmp/polymerlit-${{ github.sha }}.bundle'"
