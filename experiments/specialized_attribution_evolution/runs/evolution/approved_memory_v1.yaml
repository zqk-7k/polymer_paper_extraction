schema_version: specialized_attribution_memory.v1
version: pilot-v1
production_authoritative: false
review_scope: pilot technical evidence review; domain-expert confirmation still required
  for publication
approved_patterns:
- pattern_id: xrd_multilevel_headers_v1
  source_field: crystallographic_data
  semantic_label: two_theta
  guidance: 在 XRD/WAXD 表中，2 theta 或 Bragg angle 是 crystallographic_data/two_theta；其下的
    (100)、(200) 等晶面指数是条件轴，不是性质值或样品。
  positive_cues:
  - XRD
  - WAXD
  - Bragg
  - 2 theta
  - 2θ
  negative_constraints:
  - Miller indices are conditions, not observations
  source_case_ids:
  - dev_xrd_polycarbonate
  review_note: Explicitly supported by the development table header.
- pattern_id: xrd_d_spacing_v1
  source_field: crystallographic_data
  semantic_label: d_spacing
  guidance: d-spacing、d spacing、interlayer distance 或 interplanar distance 与 Å/angstrom
    单位共同出现时，映射为 crystallographic_data/d_spacing。
  positive_cues:
  - d-spacing
  - interlayer distance
  - interplanar distance
  - angstrom
  negative_constraints:
  - do not infer values
  source_case_ids:
  - dev_xrd_polycarbonate
  review_note: Explicit header and unit support the mapping.
- pattern_id: molecular_weight_variants_v1
  source_field: average_molecular_weight
  semantic_label: molecular_weight
  guidance: Mn、Mw、Mv 和 Mz 是 average_molecular_weight/molecular_weight 的不同 variant；Mw/Mn
    或 Đ 是 molecular_weight_distribution/dispersity。
  positive_cues:
  - Mn
  - Mw
  - Mv
  - Mz
  - Mw/Mn
  - dispersity
  negative_constraints:
  - elemental analysis is not molecular weight
  source_case_ids:
  - dev_polymer_analytics
  review_note: Standard header notation is explicit in the development table.
- pattern_id: solution_viscosity_variants_v1
  source_field: solution_viscosity
  semantic_label: solution_viscosity
  guidance: eta_inh 或 inherent viscosity 映射为 solution_viscosity，variant=inherent；intrinsic、reduced
    和 specific viscosity 必须保留各自 variant。
  positive_cues:
  - eta_inh
  - inherent viscosity
  - intrinsic viscosity
  - reduced viscosity
  negative_constraints:
  - melt viscosity and dynamic viscosity remain official properties
  source_case_ids:
  - dev_polymer_analytics
  review_note: The table explicitly reports eta_inh and its unit.
rejected_or_pending:
- pattern_id: grouped_sample_calcd_found_v1
  decision: pending
