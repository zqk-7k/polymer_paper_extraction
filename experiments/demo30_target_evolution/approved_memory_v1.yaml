schema_version: specialized_coverage_memory.v1
version: development-review-1
production_authoritative: false
derivation: Expert-approved, value-free retrieval cues generalized from three development papers.
retrieval_aliases:
  average_molecular_weight:
    - molar mass
    - molecular mass
    - gel permeation chromatography
    - size exclusion chromatography
    - polydispersity index
  solution_viscosity:
    - eta inh
    - eta red
    - eta sp
    - viscosity number
    - dL g-1
  crystallinity:
    - crystalline state
    - crystalline fraction
    - percent crystallinity
    - crystallinity percentage
  degree_of_polymerization:
    - NMR end group analysis
    - oligomer chain length
    - average chain length
  crystallographic_data:
    - lattice spacing
    - layer spacing
    - basal spacing
    - X-ray reflection
  primary_structure_informations:
    - alternating copolymer
    - main-chain
    - side-chain
    - grafted chain
    - branched chain
  morphology:
    - phase compatibility
    - phase separation
    - polymer-polymer interaction
    - dispersed phase
    - continuous phase
  stereoregularity:
    - tacticity
    - configurational sequence
    - meso dyad
    - racemo dyad
  characteristics_of_material:
    - elastomer
    - electrolyte
    - electroconductive
    - biodegradable
    - thermosetting
    - rubbery
    - translucent
