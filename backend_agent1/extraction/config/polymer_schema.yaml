# Stage 5 表征方法规范名与常见原文写法。
characterization_methods:
  FTIR:
    aliases: [FTIR, Fourier transform infrared spectroscopy, infrared spectroscopy, infrared absorption, IR spectra]
  NMR:
    aliases: [NMR, nuclear magnetic resonance, 1H NMR, 13C NMR]
  GPC:
    aliases: [GPC, gel permeation chromatography, size exclusion chromatography]
  DSC:
    aliases: [DSC, differential scanning calorimetry]
  DMA:
    aliases: [DMA, dynamic mechanical analysis]
  dilatometry:
    aliases: [dilatometry, dilatometric, dila-tometric, dilatometrically, dilatometer, dilatometer measurement]
  TGA:
    aliases: [TGA, thermogravimetric analysis, thermal degradation]
  XRD:
    aliases: [XRD, X-ray diffraction, X-ray diffractions]
  SEM:
    aliases: [SEM, scanning electron microscopy]
  TEM:
    aliases: [TEM, transmission electron microscopy]
  AFM:
    aliases: [AFM, atomic force microscopy]
  Raman:
    aliases: [Raman, Raman spectroscopy]
  SAXS:
    aliases: [SAXS, small-angle X-ray scattering]
  UV-Vis:
    aliases: [UV-Vis, ultraviolet-visible spectroscopy]
  viscometry:
    aliases: [viscometry, viscosity measurement, viscosity measurements, intrinsic viscosity measurement, Ubbelohde viscometer, Ubbelohde-type viscometer, '[\eta]', '[\eta_{\text{max}}]']
  turbidimetry:
    aliases: [turbidimetry, turbidiometric titration, '[\Phi]', '[\Phi_{\text{max}}]']
  swelling:
    aliases: [swelling, swelling measurement, swelling measurements, equilibrium swelling, '[Q]', '[Q_{\text{max}}]']

# Stage 5 Option B 专用数值性质；DSC/TGA/GPC 的宏观性质仍由 Stage 4 输出。
stage5_property_vocabulary:
  ftir_peak_wavenumber:
    category: composition_structure
    methods: [FTIR]
  nmr_chemical_shift:
    category: composition_structure
    methods: [NMR]
  raman_peak_wavenumber:
    category: composition_structure
    methods: [Raman]
  xrd_diffraction_peak_2theta:
    category: morphology
    methods: [XRD]
  xrd_crystallinity:
    category: morphology
    methods: [XRD]
  morphology_domain_size:
    category: morphology
    methods: [SEM, TEM, AFM]
  morphology_particle_size:
    category: morphology
    methods: [SEM, TEM, AFM]
  saxs_scattering_peak:
    category: morphology
    methods: [SAXS]

# PolyInfo 挂在 Sample 上的 9 类 specialized 性质。
# 与 property_vocabulary（99 条 official）零重叠，唯一例外是黏度改道：
# intrinsic_viscosity 精确匹配后归入 solution_viscosity，melt/dynamic 不改道。
#
# 每条含义：
#   source_field   PolyInfo 9 个字段名之一；缺失即无发布资格
#   value_kinds    允许的 value_kind，供 4R 分流时校验
#   aliases        表头/正文文本，转义后按词边界匹配，禁止子串包含
#   header_patterns 公式型写法专用正则，pattern 内自行容忍 LaTeX 反斜杠
#   context_patterns 需同时命中的上下文，用于消歧
#   stages         允许写入该 key 的 Stage
specialized_property_vocabulary:
  molecular_weight:
    source_field: average_molecular_weight
    value_kinds: [numeric_scalar, numeric_multiple]
    aliases:
      - molecular weight
      - mol. wt
      - average molecular mass
      - average molar mass
      - av. molar mass
      - number average molecular weight
      - weight average molecular weight
    header_patterns:
      - 'M\s*\?_?\s*\{?\s*[nwvz]\s*\}?'
    stages: [stage4, stage4t, stage5]

  solution_viscosity:
    source_field: solution_viscosity
    value_kinds: [numeric_scalar, numeric_multiple]
    aliases:
      - intrinsic viscosity
      - inherent viscosity
      - reduced viscosity
      - specific viscosity
      - relative viscosity
    header_patterns:
      - '\?eta\s*\?_?\s*\{?\s*(?:inh|red|sp|rel)\s*\}?'
      - '\[\s*\?eta\s*\]'
    stages: [stage4, stage4t]

  crystallinity:
    source_field: crystallinity
    value_kinds: [numeric_scalar, numeric_multiple, text]
    aliases:
      - crystallinity
      - degree of crystallinity
      - crystalline fraction
      - percent crystallinity
    header_patterns:
      - 'X\s*\?_?\s*\{?\s*c\s*\}?'
    stages: [stage4, stage4t, stage5]

  degree_of_polymerization:
    source_field: degree_of_polymerization
    value_kinds: [numeric_scalar, numeric_multiple]
    aliases:
      - degree of polymerization
      - polymerization degree
      - dp
    stages: [stage4, stage4t]

  # 第 5 类拆两个 key：d 值与 2θ 是同一张 XRD 表的两列，需分别绑定。
  # header_patterns 容忍 '$2\theta$'——共享的 _normalized_text 不剥反斜杠，
  # 故 pattern 自己吃掉可能存在的 '\'，不去改那个共享函数。
  d_spacing:
    source_field: crystallographic_data
    value_kinds: [numeric_scalar, numeric_multiple]
    aliases:
      - d-spacing
      - d spacing
      - interlayer spacing
      - interplanar distance
      - interplanar spacing
    header_patterns:
      - '(?:^|\W)d\s*(?:-|\s)?\s*spacing'
      - '(?:^|\W)d\s*\(\s*(?:\\?\s*(?:aa|text)|å|angstrom|nm)'
    context_patterns:
      - 'x-?ray|xrd|waxd|saxs|diffraction|bragg|reflection'
    stages: [stage4t, stage5]

  two_theta:
    source_field: crystallographic_data
    value_kinds: [numeric_scalar, numeric_multiple]
    aliases:
      - two theta
      - diffraction angle
    header_patterns:
      - '2\s*\\?\s*(?:theta|θ)'
    context_patterns:
      - 'x-?ray|xrd|waxd|saxs|diffraction|bragg|reflection'
    stages: [stage4t, stage5]

  # 第 6~9 类为描述型：value_kind 恒为 text（第 9 类为 categorical）。
  # 无数值分支，见方案 §4.2 / §4.6。
  primary_structure_informations:
    source_field: primary_structure_informations
    value_kinds: [text]
    aliases:
      - chain structure
      - primary structure
      - end group
      - branching
      - crosslinking
      - gel content
    stages: [stage4, stage5]

  morphology:
    source_field: morphology
    value_kinds: [text]
    aliases:
      - morphology
      - domain structure
      - phase structure
      - lamellar structure
      - spherulite
    stages: [stage4, stage5]

  stereoregularity:
    source_field: stereoregularity
    value_kinds: [text]
    aliases:
      - stereoregularity
      - tacticity
      - isotactic
      - syndiotactic
      - atactic
      - cis content
      - trans content
    stages: [stage4, stage5]

  # 第 9 类为闭集受控词表，非自由文本。33 个取值由全量 109 篇 GT 实测得出，
  # 分 4 桶。写全 33 项而非仅 19 篇内出现的取值：闭集本身成本极低，
  # 若只登记子集，19 篇外的文档会在合法取值上校验失败。
  # 大小写按 GT 原样保留，匹配时不区分大小写。
  characteristics_of_material:
    source_field: characteristics_of_material
    value_kinds: [categorical]
    # aliases 用于 stage4t 表头确定性匹配；stage4 正文由 LLM prompt 处理。
    # 故意只登记较精确的多词短语，避免 "type"/"form" 等单词误命中无关表头。
    aliases:
      - characteristics of material
      - material characteristics
      - polymer characteristics
      - material type
      - structure type
    stages: [stage4, stage4t]
    categorical_buckets:
      shape_and_constructional_feature:
        - linear
        - comb
        - crosslinked
        - Ionomer
        - branched
        - polyelectrolyte
      general_feature:
        - Thermoplastic
        - Elastomer
        - Thermosetting
      general_crystalline_state:
        - Crystal
        - Amorphous
        - Liquid crystal
      functional_feature:
        - Thermally stable
        - Thermostable
        - Electroconductive
        - Biodegradable
        - electrolyte
        - Flame-retardant
        - Organo-soluble
        - Semiconductive
        - Non-linear optical(NLO)
        - Gas separable
        - Photochromic
        - Hydrolytically stable
        - Water soluble
        - Photoluminescent
        - Photocrosslinkable
        - fluorescent
        - Fluorescent and thermally stable
        - Photocurable
        - Photoconductive
        - photorefractive
        - Hydrolytically unstable


