<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polymer Identity</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/library.css"></head><body>
<header><a class="brand" href="/"><span class="brand-monogram">P</span><span>POLYMER IDENTITY<small>材料身份与文献证据</small></span></a><nav><a data-area="workbench" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5M8 16h8"/></svg>身份证工作台</a><a id="paper-nav" data-area="papers" href="/paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M10.5 8 6.5 15M13.5 8l4 7M8 18h8"/></svg>文献身份证</a><a data-area="knowledge" href="/knowledge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg>组分库</a></nav><span class="app-local"><i></i>本地工作区 <span>CORE 0.9</span></span></header>
<main><section id="input-area"><div><p class="eyebrow">从文本到化学身份</p><h1>描述高分子，得到身份证</h1><p>输入材料名称、单体、连接方式或重复结构，生成结构、组分与最可能 IUPAC 名称。</p><p class="name-note">信息不足时保留适用范围、证据和未知。</p><div class="text-examples"><span>试填描述</span><button type="button" data-example="乙烯均聚物，主链重复结构为 –CH₂–CH₂–，端基、链长及分子量未提供。">线性均聚物</button><button type="button" data-example="由苯乙烯与丙烯腈形成的共聚物；序列与比例未知，端基及分子量未提供。">共聚物</button><button type="button" data-example="聚乙烯与聚丙烯的物理共混材料；未提供两者比例，不声明形成共价键。">物理共混</button></div></div><form id="generate"><label for="text" class="input-label">高分子相关文本描述</label><textarea id="text" maxlength="60000" placeholder="例如：单体是什么？如何连接？是否有已知立构、盐态、序列或组成比例？也可直接粘贴一段材料描述。" aria-label="材料描述"></textarea><div class="form-line"><span class="name-note">提交后自动保存，可离开页面后继续查看。</span><button type="submit" id="generate-button">生成身份证与 IUPAC 名称</button></div><details class="pdf-input"><summary>使用 PDF 文献作为输入</summary><label class="file-label">选择 PDF<input type="file" id="pdf" accept="application/pdf"></label><span id="file-name"></span><p class="name-note">文本与 PDF 每次选择一种输入。</p></details></form></section>
<div class="workspace"><aside><h2 id="list-heading">近期任务</h2><div id="jobs"></div></aside><article><div id="status" role="status"></div><div id="reader"><div class="empty"><h2>每份身份证都保留来源和未知</h2><p>完成的结果将自动保存并采用。选择任务后，在这里连续阅读。</p></div></div></article></div></main><dialog id="zoom"><button id="close-zoom" aria-label="关闭">关闭</button><img id="zoom-img" alt="放大的结构图"></dialog><dialog id="component-passport" class="library-passport" aria-labelledby="library-passport-title"></dialog><script src="/library.js"></script><script src="/app.js"></script></body></html>
