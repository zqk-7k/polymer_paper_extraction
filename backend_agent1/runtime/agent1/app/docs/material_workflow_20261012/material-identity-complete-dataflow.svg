<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="2350" viewBox="0 0 3800 2350">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#196c59"/></marker>
  <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#687773"/></marker>
  <style>
  .title { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#18302d; font-size:34px; font-weight:700; }
  .subtitle { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#687773; font-size:19px; }
  .lane { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:white; font-size:22px; font-weight:700; }
  .node-title { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#18302d; font-size:21px; font-weight:700; }
  .node-text { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#687773; font-size:18px; }
  .decision-text { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#18302d; font-size:19px; font-weight:700; }
  .edge-label { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#196c59; font-size:16px; font-weight:700; }
  .legend { font-family:'Droid Sans Fallback','Noto Sans CJK SC',sans-serif; fill:#687773; font-size:17px; }
  </style>
</defs>
<rect width="3800" height="2350" fill="#f2f7f3"/>
<text x="80" y="55" class="title">完整数据流：材料身份从文献证据到可采用档案</text>
<text x="80" y="95" class="subtitle">每个节点都标出数据新增/变化；实线表示正式数据流，虚线表示回读、循环、恢复或专家反馈。</text>
<rect x="80" y="145" width="680" height="1990" rx="16" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><rect x="80" y="145" width="680" height="58" rx="16" fill="#18302d"/><rect x="80" y="187" width="680" height="16" fill="#18302d"/><text x="102" y="183" class="lane">1  文献来源与可回放解析</text><rect x="800" y="145" width="680" height="1990" rx="16" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><rect x="800" y="145" width="680" height="58" rx="16" fill="#18302d"/><rect x="800" y="187" width="680" height="16" fill="#18302d"/><text x="822" y="183" class="lane">2  证据单元与材料对象归因</text><rect x="1520" y="145" width="680" height="1990" rx="16" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><rect x="1520" y="145" width="680" height="58" rx="16" fill="#18302d"/><rect x="1520" y="187" width="680" height="16" fill="#18302d"/><text x="1542" y="183" class="lane">3  身份内核与 Agent 证据闭环</text><rect x="2240" y="145" width="680" height="1990" rx="16" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><rect x="2240" y="145" width="680" height="58" rx="16" fill="#18302d"/><rect x="2240" y="187" width="680" height="16" fill="#18302d"/><text x="2262" y="183" class="lane">4  宿主验收、采用与版本封存</text><rect x="2960" y="145" width="680" height="1990" rx="16" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><rect x="2960" y="145" width="680" height="58" rx="16" fill="#18302d"/><rect x="2960" y="187" width="680" height="16" fill="#18302d"/><text x="2982" y="183" class="lane">5  材料身份库与专家评审</text><path d="M 420.0,420 L 420.0,470" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 420.0,640 L 420.0,690" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 420.0,860 L 420.0,910" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 420.0,1080 L 420.0,1130" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 420.0,1300 L 420.0,1370" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1140.0,430 L 1140.0,500" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1140.0,670 L 1140.0,760" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1140.0,1200 L 1140.0,1270" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1140.0,1440 L 1140.0,1510" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1140.0,1680 L 1140.0,1750" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1860.0,530 L 1860.0,650" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1860.0,820 L 1860.0,940" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1860.0,1110 L 1860.0,1230" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 2580.0,590 L 2580.0,720" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 2580.0,890 L 2580.0,1030" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 2580.0,1200 L 2580.0,1310" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 2580.0,1480 L 2580.0,1570" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 3300.0,1040 L 3300.0,1180" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 3300.0,1350 L 3300.0,1500" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><path d="M 700,1455.0 L 780,1455.0 L 780,345 L 860,345.0" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><text x="725" y="280" class="edge-label" fill="#196c59">通过</text><path d="M 1420,1835.0 L 1490,1835.0 L 1490,445 L 1580,445.0" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><text x="1320" y="415" class="edge-label" fill="#196c59">候选结构/命名→身份</text><path d="M 2140,1315.0 L 2210,1315.0 L 2210,505 L 2300,505.0" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><text x="2145" y="475" class="edge-label" fill="#196c59">充分→验收</text><path d="M 2860,1655.0 L 2930,1655.0 L 2930,955 L 3020,955.0" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><text x="2860" y="930" class="edge-label" fill="#196c59">封存后入库</text><path d="M 420.0,1540 L 420.0,1620" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="445" y="1575" class="edge-label" fill="#687773">否</text><path d="M 700,1705.0 L 760,1705.0 L 760,345 L 860,345.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="720" y="1585" class="edge-label" fill="#687773">回到证据生成</text><path d="M 1420,845.0 L 1470,845.0 L 1470,1545 L 1580,1585.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="1320" y="1510" class="edge-label" fill="#687773">否：待确认</text><path d="M 1420,845.0 L 1510,845.0 L 1510,1080 L 860,1115.0" fill="none" stroke="#196c59" stroke-width="5" marker-end="url(#arrow)"/><text x="1460" y="1050" class="edge-label" fill="#196c59">是</text><path d="M 1420,345.0 L 1510,345.0 L 1580,445.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="1320" y="325" class="edge-label" fill="#687773">多源证据汇入</text><path d="M 1420,585.0 L 1510,585.0 L 1510,445 L 1580,445.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><path d="M 1420,1355.0 L 1510,1355.0 L 1510,445 L 1580,445.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><path d="M 1420,1595.0 L 1510,1595.0 L 1510,445 L 1580,445.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><path d="M 1420,1835.0 L 1510,1835.0 L 1510,445 L 1580,445.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><path d="M 2140,1025.0 L 2190,1025.0 L 2190,215 L 820,215 L 820,345 L 860,345.0" fill="none" stroke="#687773" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="960" y="205" class="edge-label" fill="#687773">工具结果/来源回读回写</text><path d="M 2140,1315.0 L 2190,1315.0 L 2190,1545 L 1580,1585.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="2060" y="1455" class="edge-label" fill="#687773">否：保留未知/冲突</text><path d="M 2140,1315.0 L 2190,1315.0 L 2190,1835 L 1580,1855.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="2080" y="1775" class="edge-label" fill="#687773">继续迭代</text><path d="M 2140,1855.0 L 2220,1855.0 L 2220,650 L 1580,735.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="1940" y="1735" class="edge-label" fill="#687773">仍有缺口→AgentState</text><path d="M 2580.0,1200 L 2580,1210 L 2580,1830 L 2300,1915.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="2535" y="1300" class="edge-label" fill="#687773">否：恢复</text><path d="M 2300,1915.0 L 2210,1915.0 L 2210,650 L 2140,735.0" fill="none" stroke="#687773" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="2130" y="1675" class="edge-label" fill="#687773">最近检查点</text><path d="M 3020,1265.0 L 2920,1265.0 L 2920,2220 L 1480,2220 L 1480,1020 L 2140,735.0" fill="none" stroke="#687773" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow-muted)"/><text x="2040" y="2200" class="edge-label" fill="#687773">新增证据/修订建议</text><rect x="140" y="250" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="162" y="284" class="node-title">D00  任务说明  JobSpec</text><text x="162" y="322" class="node-text">+ 文献路径 · 领域 · 运行ID</text><text x="162" y="353" class="node-text">→ 形成一次可追踪任务</text><rect x="140" y="470" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="162" y="504" class="node-title">D01  原始文献包  SourcePacket</text><text x="162" y="542" class="node-text">+ PDF/补充材料 · 元数据 · 文件hash</text><text x="162" y="573" class="node-text">→ 保留原始材料边界</text><rect x="140" y="690" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="162" y="724" class="node-title">D02  运行前预检  Preflight</text><text x="162" y="762" class="node-text">+ 路径/权限/运行时/Kernel/规则版本</text><text x="162" y="793" class="node-text">→ 通过才进入解析</text><rect x="140" y="910" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="162" y="944" class="node-title">D03  来源清单  SourceManifest</text><text x="162" y="982" class="node-text">+ source_id · 页/图/表定位</text><text x="162" y="1013" class="node-text">+ 解析器版本 · 可回放索引</text><rect x="140" y="1130" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="162" y="1164" class="node-title">D04  解析语料  ParsedCorpus</text><text x="162" y="1202" class="node-text">页面 → 文本块 · 图题 · 表格单元 · 坐标</text><text x="162" y="1233" class="node-text">+ MinerU/回退路径 · 版本</text><polygon points="420.0,1370 700,1455.0 420.0,1540 140,1455.0" fill="#ffffff" stroke="#18302d" stroke-width="4"/><text x="420.0" y="1444.0" class="decision-text" text-anchor="middle">G0  解析可回读？</text><text x="420.0" y="1472.0" class="decision-text" text-anchor="middle">主解析成功，且页图/文本可定位？</text><rect x="140" y="1620" width="560" height="170" rx="16" fill="#f7faf8" stroke="#687773" stroke-width="3"/><text x="162" y="1654" class="node-title">回退来源  Fallback</text><text x="162" y="1692" class="node-text">解析失败 → PDF文本/原页图/人工回读</text><text x="162" y="1723" class="node-text">→ 仍生成可定位 EvidenceUnit</text><rect x="860" y="260" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="294" class="node-title">D05  证据单元  EvidenceUnit</text><text x="882" y="332" class="node-text">+ claim_type · 原文片段 · 页/图/表位置</text><text x="882" y="363" class="node-text">+ 证据强度 · 原始引用</text><rect x="860" y="500" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="534" class="node-title">D06  材料出现  OccurrenceBundle</text><text x="882" y="572" class="node-text">事实 → 样品/材料标签与作用域</text><text x="882" y="603" class="node-text">+ 主链/共聚/接枝/端基/填料/添加剂角色</text><polygon points="1140.0,760 1420,845.0 1140.0,930 860,845.0" fill="#ffffff" stroke="#18302d" stroke-width="4"/><text x="1140.0" y="834.0" class="decision-text" text-anchor="middle">G1  对象与角色明确？</text><text x="1140.0" y="862.0" class="decision-text" text-anchor="middle">样品、组分、工艺阶段可以区分？</text><rect x="860" y="1030" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="1064" class="node-title">D07  组分候选  ComponentSet</text><text x="882" y="1102" class="node-text">+ 单体/CRU/片段 · 结构表示 · 来源</text><text x="882" y="1133" class="node-text">+ 连接端口 · 电荷 · 盐 · 立体/同位素</text><rect x="860" y="1270" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="1304" class="node-title">D08  候选结构图  CandidateGraph</text><text x="882" y="1342" class="node-text">+ 组成/连接/架构边：嵌段·无规·接枝·交联</text><text x="882" y="1373" class="node-text">+ 多候选 · 冲突 · 未知；不强行合并</text><rect x="860" y="1510" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="1544" class="node-title">D09  性质与条件包  PropertyPackage</text><text x="882" y="1582" class="node-text">+ Mw/Mn/Đ · Tg/Tm · 力学/热/光/电性质</text><text x="882" y="1613" class="node-text">+ 方法 · 单位 · 温度/时间 · 样品状态/作用域</text><rect x="860" y="1750" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="882" y="1784" class="node-title">D10  命名候选包  NameBundle</text><text x="882" y="1822" class="node-text">+ 规则名 · IUPAC候选 · preferred name</text><text x="882" y="1853" class="node-text">+ catalog候选 · 规则条目 · 与结构图映射</text><rect x="1580" y="360" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="1602" y="394" class="node-title">D11  身份轮廓  IdentityProfile</text><text x="1602" y="432" class="node-text">L1 名称→实体；L2 实体→构成/CRU</text><text x="1602" y="463" class="node-text">L3 六元组+作用域；L4 审核；typed unknown(⊥)</text><rect x="1580" y="650" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="1602" y="684" class="node-title">D12  Agent 状态  AgentState</text><text x="1602" y="722" class="node-text">+ 迭代号 · 当前假设 · 证据缺口 · 冲突队列</text><text x="1602" y="753" class="node-text">+ 待查页/图/表 · 已用工具 · 停止条件</text><rect x="1580" y="940" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="1602" y="974" class="node-title">D13  工具结果  ToolResult</text><text x="1602" y="1012" class="node-text">结构/命名/来源/图表核查的输入与输出</text><text x="1602" y="1043" class="node-text">+ 工具版本 · 回执 · 结果挂接到证据/候选图</text><polygon points="1860.0,1230 2140,1315.0 1860.0,1400 1580,1315.0" fill="#ffffff" stroke="#18302d" stroke-width="4"/><text x="1860.0" y="1304.0" class="decision-text" text-anchor="middle">G2  证据充分？</text><text x="1860.0" y="1332.0" class="decision-text" text-anchor="middle">关键字段有证据？冲突已解释或显式保留？</text><rect x="1580" y="1500" width="560" height="170" rx="16" fill="#f7faf8" stroke="#687773" stroke-width="3"/><text x="1602" y="1534" class="node-title">待确认  UnknownQueue</text><text x="1602" y="1572" class="node-text">typed unknown(⊥) · 冲突候选 · 角色不明</text><text x="1602" y="1603" class="node-text">保留缺口与来源，等待回读/人工确认</text><rect x="1580" y="1770" width="560" height="170" rx="16" fill="#f7faf8" stroke="#196c59" stroke-width="3"/><text x="1602" y="1804" class="node-title">Agent循环停止条件</text><text x="1602" y="1842" class="node-text">无待查证据；关键字段有支撑；命名/结构检查通过</text><text x="1602" y="1873" class="node-text">否则回到证据、图表或补充材料继续迭代</text><rect x="2300" y="420" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="2322" y="454" class="node-title">D14  验收报告  ValidationReport</text><text x="2322" y="492" class="node-text">Kernel解析 · 结构/命名一致性 · 证据覆盖</text><text x="2322" y="523" class="node-text">+ 来源可追溯性 · 冲突/未知 · 警告</text><rect x="2300" y="720" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="2322" y="754" class="node-title">D15  宿主候选包  HostCandidateBundle</text><text x="2322" y="792" class="node-text">+ 身份轮廓 · 候选结构图 · 性质/命名</text><text x="2322" y="823" class="node-text">+ 证据索引 · 工具结果 · 可复核日志</text><polygon points="2580.0,1030 2860,1115.0 2580.0,1200 2300,1115.0" fill="#ffffff" stroke="#18302d" stroke-width="4"/><text x="2580.0" y="1104.0" class="decision-text" text-anchor="middle">G3  宿主验收通过？</text><text x="2580.0" y="1132.0" class="decision-text" text-anchor="middle">schema、预算、版本、权限和采用合同通过？</text><rect x="2300" y="1310" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="2322" y="1344" class="node-title">D16  采用包  AdoptedBundle</text><text x="2322" y="1382" class="node-text">+ 被选身份 · 作用域 · 版本 · 来源证据</text><text x="2322" y="1413" class="node-text">→ 允许写入正式材料身份档案</text><rect x="2300" y="1570" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="2322" y="1604" class="node-title">D17  封存收据  Passport</text><text x="2322" y="1642" class="node-text">+ run_id · source hash · session/model</text><text x="2322" y="1673" class="node-text">+ Kernel/规则/工具哈希 · 输入输出清单</text><rect x="2300" y="1830" width="560" height="170" rx="16" fill="#f7faf8" stroke="#687773" stroke-width="3"/><text x="2322" y="1864" class="node-title">恢复检查点  RecoveryCheckpoint</text><text x="2322" y="1902" class="node-text">+ 最近成功迭代 · EvidenceStore · CandidateGraph</text><text x="2322" y="1933" class="node-text">+ 待办项/错误原因；失败不污染正式库</text><rect x="3020" y="870" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="3042" y="904" class="node-title">D19  材料身份库  IdentityLibrary</text><text x="3042" y="942" class="node-text">已采用身份、结构/名称/性质与证据链</text><text x="3042" y="973" class="node-text">+ 版本历史 · catalog映射 · 可检索索引</text><rect x="3020" y="1180" width="560" height="170" rx="16" fill="#ffffff" stroke="#196c59" stroke-width="3"/><text x="3042" y="1214" class="node-title">D20  材料专家评审</text><text x="3042" y="1252" class="node-text">确认材料对象、结构关系、性质作用域和未知项</text><text x="3042" y="1283" class="node-text">→ 补充证据或触发增量修订</text><rect x="3020" y="1500" width="560" height="170" rx="16" fill="#edf5f0" stroke="#196c59" stroke-width="3"/><text x="3042" y="1534" class="node-title">D21  可复用输出</text><text x="3042" y="1572" class="node-text">材料身份档案 · 候选与证据 · 版本/回放入口</text><text x="3042" y="1603" class="node-text">→ 支持后续检索、对比和数据扩展</text><rect x="80" y="2170" width="3500" height="150" rx="14" fill="#ffffff" stroke="#dce5df" stroke-width="2"/><text x="105" y="2202" class="legend"><tspan font-weight="700" fill="#18302d">图例：</tspan>实线 = 正式数据变化　虚线 = 来源回读 / Agent循环 / 恢复 / 专家反馈　菱形 = 是否满足进入下一阶段的材料条件</text><text x="105" y="2235" class="legend"><tspan font-weight="700" fill="#18302d">数据生命周期：</tspan>原始文献 → 可回放来源 → 证据单元 → 材料出现/角色 → 组分与候选结构图 → 性质/命名 → 分层身份轮廓 → 验收报告 → 采用包 → 封存护照 → 材料身份库</text><text x="105" y="2268" class="legend">持久化边界：项目根目录/config + data → 规则、运行配置、注册快照；同级 Polymer_Identity_App_Data → sources、解析中间物、runs、checkpoints、adopted、sealed、library。</text><text x="105" y="2301" class="legend">实际代码对应：require_preflight = 运行前预检；run_job = 单篇材料文献完整抽取；READY_FOR_HOST_COMMIT = 可交宿主候选；Host save/adoption = 验收后采用；adoption recovery = 检查点恢复。</text></svg>