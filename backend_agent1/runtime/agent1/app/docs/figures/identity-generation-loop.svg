<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient>
  <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6B4EFF"/><stop offset="1" stop-color="#956DFF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#15223B" flood-opacity=".13"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B4EFF"/></marker>
  <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#168F87"/></marker>
  <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E47C35"/></marker>
  <style>
    .k{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#16233D}
    .muted{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#637089}
    .small{font-size:18px}
    .label{font-size:23px;font-weight:700}
    .title{font-size:38px;font-weight:800}
    .cap{font-size:15px;font-weight:800;letter-spacing:2px}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="86" y="70" class="muted cap">ONE PAPER · PERSISTENT AGENT LOOP</text>
<text x="86" y="122" class="k title">单篇任务：阅读、建图、核验、采用</text>
<text x="86" y="157" class="muted small">把一次文献身份提取拆成可回放的证据循环；Agent 负责推理，宿主负责边界与落盘。</text>

<rect x="70" y="205" width="355" height="430" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="70" y="205" width="355" height="12" rx="6" fill="#E47C35"/>
<text x="102" y="265" class="k label">来源上下文</text>
<text x="102" y="298" class="muted small">只读证据区</text>
<rect x="102" y="333" width="80" height="92" rx="13" fill="#FFF0E6"/>
<path d="M122 350h40v48h-40zM128 360h28M128 372h28M128 384h20" fill="none" stroke="#E47C35" stroke-width="5" stroke-linecap="round"/>
<text x="200" y="365" class="k small">原文 / PDF</text><text x="200" y="395" class="muted small">页图、全文、页码索引</text>
<rect x="102" y="461" width="80" height="92" rx="13" fill="#EAF4FF"/>
<circle cx="142" cy="493" r="19" fill="none" stroke="#2477B8" stroke-width="5"/><path d="M156 508l17 17" stroke="#2477B8" stroke-width="5" stroke-linecap="round"/>
<text x="200" y="493" class="k small">观察记录</text><text x="200" y="523" class="muted small">事实、假设、未知项</text>
<path d="M425 420H505" stroke="#E47C35" stroke-width="5" marker-end="url(#orangeArrow)"/>

<rect x="505" y="205" width="650" height="430" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="505" y="205" width="650" height="12" rx="6" fill="#6B4EFF"/>
<text x="545" y="265" class="k label">持续 Agent 会话</text>
<text x="545" y="298" class="muted small">同一会话保留上下文；每轮都留下状态和收据</text>
<circle cx="810" cy="420" r="128" fill="#F5F1FF" stroke="#D9CFFF" stroke-width="4"/>
<circle cx="810" cy="420" r="90" fill="url(#agent)" filter="url(#shadow)"/>
<path d="M770 397c0-21 18-38 40-38s40 17 40 38v36c0 21-18 38-40 38s-40-17-40-38z" fill="none" stroke="#FFF" stroke-width="7"/>
<circle cx="795" cy="416" r="7" fill="#FFF"/><circle cx="825" cy="416" r="7" fill="#FFF"/>
<path d="M790 445q20 15 40 0" fill="none" stroke="#FFF" stroke-width="7" stroke-linecap="round"/>
<text x="755" y="557" class="k label" fill="#6B4EFF">AGENT</text>
<path d="M810 282A138 138 0 0 1 942 421" fill="none" stroke="#6B4EFF" stroke-width="7" marker-end="url(#arrow)"/>
<path d="M942 421A138 138 0 0 1 810 558" fill="none" stroke="#6B4EFF" stroke-width="7" marker-end="url(#arrow)"/>
<path d="M810 558A138 138 0 0 1 678 421" fill="none" stroke="#6B4EFF" stroke-width="7" marker-end="url(#arrow)"/>
<path d="M678 421A138 138 0 0 1 810 282" fill="none" stroke="#6B4EFF" stroke-width="7" marker-end="url(#arrow)"/>
<text x="608" y="367" class="muted small">读源</text><text x="948" y="367" class="muted small">建模</text><text x="936" y="493" class="muted small">调用工具</text><text x="604" y="493" class="muted small">复核 / 回看</text>
<path d="M1155 420H1235" stroke="#168F87" stroke-width="5" marker-end="url(#tealArrow)"/>

<rect x="1235" y="205" width="295" height="430" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="1235" y="205" width="295" height="12" rx="6" fill="#168F87"/>
<text x="1270" y="265" class="k label">宿主验收门</text>
<text x="1270" y="298" class="muted small">Agent 不直接发布</text>
<rect x="1270" y="348" width="225" height="70" rx="18" fill="#E8F7F4"/><text x="1295" y="392" class="k small">状态哈希 + 证据</text>
<rect x="1270" y="438" width="225" height="70" rx="18" fill="#E8F7F4"/><text x="1295" y="482" class="k small">Kernel / Passport</text>
<rect x="1270" y="528" width="225" height="70" rx="18" fill="#E8F7F4"/><text x="1295" y="572" class="k small">版本束 + 采用指针</text>
<path d="M1360 615v38" stroke="#168F87" stroke-width="5" marker-end="url(#tealArrow)"/>

<rect x="70" y="705" width="1460" height="170" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="102" y="752" class="k label">六个可回放动作</text>
<g class="k small" text-anchor="middle">
  <rect x="102" y="785" width="188" height="55" rx="17" fill="#FFF4EA"/><text x="196" y="820">01 读源</text>
  <rect x="316" y="785" width="188" height="55" rx="17" fill="#F2EEFF"/><text x="410" y="820">02 建图</text>
  <rect x="530" y="785" width="188" height="55" rx="17" fill="#F2EEFF"/><text x="624" y="820">03 调工具</text>
  <rect x="744" y="785" width="188" height="55" rx="17" fill="#EAF4FF"/><text x="838" y="820">04 写状态</text>
  <rect x="958" y="785" width="188" height="55" rx="17" fill="#E8F7F4"/><text x="1052" y="820">05 复核</text>
  <rect x="1172" y="785" width="258" height="55" rx="17" fill="#E8F7F4"/><text x="1301" y="820">06 缺口回看</text>
</g>
<path d="M290 812H312M504 812H526M718 812H740M932 812H954M1146 812H1168" stroke="#A2AEC2" stroke-width="3" marker-end="url(#tealArrow)"/>
<text x="100" y="930" class="muted small">边界：来源名称不是身份结论；图一致性不是来源证明；复杂规则或证据不足时，循环可以安全停在 INCOMPLETE。</text>
<text x="1450" y="930" text-anchor="end" class="muted small">主循环：source → graph → tools → state → review → adopt</text>
</svg>